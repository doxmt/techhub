name: Probe contest sources

# 대체 공모전 출처가 데이터센터 IP에서 접근되는지 확인하는 임시 워크플로 (issue #49)
on:
  push:
    branches:
      - fix/49-위비티403-로컬수집

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability from datacenter IP
        run: |
          UA="Mozilla/5.0 (compatible; TechHubBot/1.0)"
          check() {
            code=$(curl -s -o /tmp/o.html -w "%{http_code}" -A "$UA" --max-time 20 "$1" || echo ERR)
            size=$(wc -c < /tmp/o.html 2>/dev/null || echo 0)
            echo "  [$code] ${size}B  $1"
          }
          echo "== 콘테스트코리아 =="
          check "https://www.contestkorea.com/"
          check "https://www.contestkorea.com/sub/list.php?displayrow=48&int_gbn=1&Txt_bcode=030510001"
          echo "== 링커리어 =="
          check "https://linkareer.com/list/contest"
          echo "== 위비티 (대조군) =="
          check "https://www.wevity.com/?c=find&s=1&gub=1&cidx=21"
